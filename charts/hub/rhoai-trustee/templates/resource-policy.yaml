{{- $bindings := .Values.kbs.resourcePolicy.modelKeyBindings | default dict -}}
{{- $guests := .Values.kbs.resourcePolicy.confidentialGuestBindings | default dict -}}
{{- range $tag, $binding := merge (deepCopy $bindings) $guests -}}
{{- if not (regexMatch "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$" $tag) -}}
{{- fail "modelKeyBindings requires valid resource tags" -}}
{{- end -}}
{{- if not (regexMatch "^[0-9a-f]{64}$" ($binding.initData | default "")) -}}
{{- fail "Guest binding requires a SHA-256 initData" -}}
{{- end -}}
{{- if eq ($binding.tee | default "") "snp" -}}
{{- if or (ne (len $binding) 3) (not (regexMatch "^[0-9a-f]{96}$" ($binding.launchMeasurement | default ""))) -}}
{{- fail "SNP binding requires tee, SHA-384 launchMeasurement and initData" -}}
{{- end -}}
{{- else if eq ($binding.tee | default "") "tdx" -}}
{{- if or (ne (len $binding) 5) (not (regexMatch "^[0-9a-f]{96}$" ($binding.mrTd | default ""))) (not (regexMatch "^[0-9a-f]{96}$" ($binding.rtmr1 | default ""))) (not (regexMatch "^[0-9a-f]{96}$" ($binding.rtmr2 | default ""))) -}}
{{- fail "TDX binding requires tee, SHA-384 mrTd/rtmr1/rtmr2 and initData" -}}
{{- end -}}
{{- else -}}
{{- fail "Guest binding requires tee: snp or tdx" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: resource-policy
  namespace: trustee-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    kbs.confidentialcontainers.org/migrated-from-v1.1.0: v1.2.0
data:
  resource-policy.rego: |
{{ .Files.Get "files/resource-policy.rego" | replace "model_key_bindings := {}" (printf "model_key_bindings := %s" (toPrettyJson $bindings)) | replace "confidential_guest_bindings := {}" (printf "confidential_guest_bindings := %s" (toPrettyJson $guests)) | indent 4 }}
